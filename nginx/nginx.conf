# This is the piece that makes "multiple server instances" a real, visible
# thing rather than just something running in the background unseen.
# Nginx round-robins each incoming connection across backend-1 and
# backend-2, so different users (or even the same user reconnecting)
# genuinely land on different instances — which is exactly the scenario
# the whole Redis-adapter setup exists to handle correctly.

events {
  worker_connections 1024;
}

http {
  upstream chat_backend {
    # Default nginx behavior is round-robin, which is exactly what we
    # want here: no session stickiness, so it's easy to prove that a
    # user on backend-1 and a user on backend-2 still see each other's
    # messages.
    server backend-1:4000;
    server backend-2:4000;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://chat_backend;

      # WebSocket connections start as a normal HTTP request and then
      # "upgrade" to a persistent connection — these two headers are
      # what tell nginx to allow that upgrade through instead of treating
      # it as a regular HTTP request/response and closing the connection.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # WebSocket connections are long-lived by design — a short default
      # timeout would silently disconnect idle chat sessions.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
